<link rel="icon" href="logo.png">

<body>
  <div class="banner" role="img" aria-label="ภาพ Banner"></div>
<header>
  <img class="logo" src="Logo.png" alt="โลโก้ตึก 9">
  <h1>ระบบตรวจสอบหน้าที่งานกีฬาสีประจำคณะสีบานเย็น ปีการศึกษา 2569</h1>
</header>

<main class="card">
  <h2>ค้นหาหน้าที่งานกีฬาสี</h2>

  <form id="v-form" novalidate>
    <input id="room" placeholder="กรอกห้องเรียน (เช่น 931)" aria-label="กรอกห้องเรียน (เช่น 931)" inputmode="numeric" pattern="\d{3}" maxlength="3" required autocomplete="off">
    <input id="no" placeholder="กรอกเลขที่ (เช่น 1)" aria-label="กรอกเลขที่ (เช่น เลขที่ 1)" inputmode="numeric" pattern="\d{1,3}" maxlength="3" required autocomplete="off">
    <button type="submit">ค้นหา</button>
  </form>
  <p id="v-msg" class="err center" role="alert" hidden></p>

  <p id="v-loading" class="center" hidden>กำลังค้นหาข้อมูล<span id="dots"></span></p>

  <div id="v-found" hidden>
    <p id="r-name"></p>
    <p id="r-room"></p>
    <p>หน้าที่ของคุณคือ <b id="r-duty"></b></p>
    <p class="note">*หากข้อมูลที่ปรากฏไม่ถูกต้อง โปรดติดต่อคณะกรรมการตึก*</p>
  </div>

  <div id="v-none" class="err" hidden>
    <p>ไม่พบข้อมูล</p>
    <p>โปรดติดต่อคณะกรรมการตึก และลองใหม่อีกครั้ง</p>
  </div>
</main>
